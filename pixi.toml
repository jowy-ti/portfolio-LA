[workspace]
authors = ["Joel Gonzalez Jimenez <joel.gonzalez.jimenez@estudiantat.upc.edu>"]
channels = ["conda-forge"]
name = "portfolio-LA"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# PDF text/image extraction. Provides pdftotext and pdftoppm.
poppler = "*"
python = "3.12.*"
# Numerics used by the notebook exercises.
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
ipywidgets = ">=8.1.9,<9"
# Notebook editing and execution, and the MCP server that exposes them.
jupyterlab = ">=4.6.5,<5"
nbformat = ">=5.11.1,<6"
nbclient = ">=0.11.0,<0.12"
ipykernel = ">=7.4.0,<8"
mcp = ">=2,<3"
jupyter_client = ">=8.10,<9"

[tasks]
