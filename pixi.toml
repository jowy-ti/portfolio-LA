[workspace]
authors = ["Joel Gonzalez Jimenez <joel.gonzalez.jimenez@estudiantat.upc.edu>"]
channels = ["conda-forge"]
name = "portfolio-LA"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# PDF text/image extraction. Provides pdftotext and pdftoppm.
poppler = "*"

[tasks]

# Environment used by the Jupyter MCP server and JupyterLab.
# Install with: pixi install -e mcp
[feature.mcp.dependencies]
python = "3.12.*"
# Numerics used by the notebook exercises.
numpy = "*"
scipy = "*"
matplotlib = "*"
ipywidgets = "*"
plotly = "*"

[feature.mcp.pypi-dependencies]
jupyterlab = "*"
jupyter-collaboration = "*"
jupyter-mcp-tools = "*"
ipykernel = "*"
jupyter-mcp-server = ">=2.2,<3"
code-sandboxes = ">=1.1.1"

[environments]
mcp = ["mcp"]
